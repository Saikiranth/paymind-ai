server.port=8081
spring.application.name=auth-service

# MySQL connection (host port 3307, remapped earlier to avoid local conflict)
spring.datasource.url=jdbc:mysql://localhost:3307/paymind_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=paymind
spring.datasource.password=paymind123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate - tables already created manually in Phase 2, so validate only, never auto-alter
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Eureka registration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# JWT settings (local dev only - use env vars / secrets manager in real deployment)
jwt.secret=paymind_super_secret_key_change_this_in_production_env_vars_only_123456
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000
