version: '3.8'

services:

  mysql:
    image: mysql:8.4
    container_name: paymind-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: paymind123
      MYSQL_DATABASE: paymind_db
      MYSQL_USER: paymind
      MYSQL_PASSWORD: paymind123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  mongodb:
    image: mongo:7
    container_name: paymind-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: paymind
      MONGO_INITDB_ROOT_PASSWORD: paymind123
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7
    container_name: paymind-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: paymind-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: paymind-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

volumes:
  mysql_data:
  mongo_data:
